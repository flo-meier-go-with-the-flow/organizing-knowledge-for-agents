[project]
name = "organizing-knowledge-for-agents"
version = "0.1.0"
description = "Agentic retrieval experiments on the Confluence slice of EnterpriseRAG-Bench"
readme = "README.md"
authors = [
    { name = "Baer, Florian", email = "florian.baer@zuehlke.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.15",
    "chromadb>=1.5.9",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
    "tqdm>=4.70.1",
    "voyageai>=0.5.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
